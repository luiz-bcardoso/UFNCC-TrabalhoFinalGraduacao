<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .chat-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .chat-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-response {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1 class="h3">Chatbot Gerador SQL</h1>
        </div>
        <form method="POST" id="chat-form">
            <div class="mb-3">
                <label for="user_input" class="form-label">Digite sua pergunta:</label>
                <input type="text" class="form-control" id="user_input" name="user_input" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
        {% if response %}
        <div class="chat-response">
            <h2 class="h5">Resposta:</h2>
            <p>{{ response }}</p>
        </div>
        {% endif %}
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <!-- Optional: Add JavaScript for dynamic behavior -->
    <script>
        document.getElementById('chat-form').addEventListener('submit', function (e) {
            e.preventDefault(); // Prevent form submission
            const formData = new FormData(this);
            fetch('/', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json',
                },
            })
            .then(response => response.text())
            .then(html => {
                document.body.innerHTML = html; // Update the page with the new response
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
